<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedrock Interaction App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-lg">
        <h1 class="text-2xl font-bold text-gray-800 mb-4 text-center">🚗 Assistente Veicular com AI 🏎️</h1>
        <div class="mb-4">
            <textarea id="inputText" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" rows="4" placeholder="Enter your prompt here..."></textarea>
        </div>
        <button id="submitBtn" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition duration-300">Submit</button>
        <div id="response" class="mt-4 p-4 bg-gray-50 rounded-lg max-h-[500px] min-h-[150px] overflow-y-auto hidden">
    <h2 class="text-lg font-semibold text-gray-700">Response:</h2>
    <div id="responseText" class="text-gray-600 break-words whitespace-pre-line"></div>
</div>
    </div>


    <script>
    document.getElementById('submitBtn').addEventListener('click', async () => {
        const inputText = document.getElementById('inputText').value;
        const responseDiv = document.getElementById('response');
        const responseText = document.getElementById('responseText');

        if (!inputText) {
            responseText.textContent = 'Please enter a prompt.';
            responseDiv.classList.remove('hidden');
            return;
        }

        try {
            const res = await fetch('http://localhost:3000/bedrock', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: inputText })
            });
            const data = await res.json();
            responseText.textContent = data.response || 'No response received.';
            responseDiv.classList.remove('hidden');
        } catch (error) {
            responseText.textContent = `Error: ${error.message}`;
            responseDiv.classList.remove('hidden');
        }
    });
</script>
</body>
</html>
